services:
  notes-db:
    image: postgres:18
    container_name: notes-db
    environment:
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - notes-net

  notes-api:
    build: .
    image: compose-project
    container_name: notes-api
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      notes-db:
        condition: service_healthy
    networks:
      - notes-net

networks:
  notes-net:

volumes:
  postgres_data:
